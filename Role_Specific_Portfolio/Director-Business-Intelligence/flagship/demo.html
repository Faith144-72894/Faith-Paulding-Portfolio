<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Executive Analytics Studio</title><style>body{margin:0;background:#eef2f7;color:#152b42;font:16px system-ui}header{background:#17334f;color:white;padding:24px}main{max-width:1000px;margin:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}section{background:white;border-radius:12px;padding:22px}label{display:block;margin:14px 0 5px}input,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #aab8c8;border-radius:5px;font:inherit}button{background:#185c9d;color:white;border:0;padding:12px 20px;margin-top:18px;border-radius:5px;cursor:pointer}article{padding:14px 0;border-bottom:1px solid #dbe2ea;overflow-wrap:anywhere}strong{display:block;font-size:20px}small{display:block}#error{color:#a32636}</style><header><small>Independent functional prototype • synthetic data</small><h1>Executive Analytics Studio</h1><p>Browser aggregation; Python SQL implementation separate</p></header><main><section><h2>1. Configure scenario</h2><form id="form"><label for="f0">CSV rows: program,budget,actual (no header)</label><textarea required id="f0" rows="2">A,100,90
B,200,220</textarea><button>2. Run analysis</button></form><p id="error" role="alert"></p></section><section><h2>3. Review decision</h2><div id="results" aria-live="polite"></div><p>Local browser logic only. No vendor connection, authentication or production deployment.</p></section></main><script>const defaults=["A,100,90\nB,200,220"];function evaluate(v){let rows=v[0].trim().split(/\n/).map(s=>s.split(','));let b=0,a=0;for(let r of rows){if(r.length!==3||!r[0].trim()||r.slice(1).some(x=>!x.trim()||!Number.isFinite(Number(x))||Number(x)<0))throw Error('Invalid CSV row');b+=Number(r[1]);a+=Number(r[2])}return {'Budget':b,'Actual':a,'Variance':b-a,'Programs':rows.length}}const form=document.getElementById('form');function run(e){if(e)e.preventDefault();const out=document.getElementById('results'),err=document.getElementById('error');out.replaceChildren();err.textContent='';try{let v=defaults.map((d,i)=>{let s=document.getElementById('f'+i).value;if(!s.trim())throw Error('All fields required');if(typeof d==='number'){let n=Number(s);if(!Number.isFinite(n))throw Error('Finite number required');return n}return s});let r=evaluate(v);for(let [k,val] of Object.entries(r)){let a=document.createElement('article'),b=document.createElement('strong');a.textContent=k;b.textContent=typeof val==='number'?Number(val.toFixed(4)).toLocaleString():String(val);a.append(b);out.append(a)}}catch(e){err.textContent=e.message}}form.addEventListener('submit',run);run();</script></html>
