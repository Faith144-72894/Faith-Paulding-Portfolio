<!doctype html><meta charset="utf-8"><title>Agent graph lab</title><style>body{font:16px system-ui;background:#edf2f7;color:#17334f;padding:24px}section{background:white;padding:20px;margin:12px}button,input{padding:10px}svg{width:100%;max-width:850px}.active{fill:#a5e0bb!important}</style><h1>Agent graph execution lab</h1><p>Independent LangGraph-inspired simulation, not actual framework runtime.</p><section><label for="q">1. Query</label> <input id="q" value="leave approval"><button id="run">2. Invoke graph</button></section><section><h2>3. Execution graph</h2><svg viewBox="0 0 650 240"><g stroke="#64748b" fill="none"><path d="M130 110H170 M300 110H340 M470 110H490V55H510 M470 110H490V175H510"/></g><g fill="#e2e8f0" stroke="#64748b"><rect id="start" x="10" y="85" width="120" height="50"/><rect id="retrieve" x="170" y="85" width="130" height="50"/><rect id="validate" x="340" y="85" width="130" height="50"/><rect id="answer" x="510" y="30" width="130" height="50"/><rect id="escalate" x="510" y="150" width="130" height="50"/></g><g font-size="14" text-anchor="middle"><text x="70" y="115">START</text><text x="235" y="115">Retrieve</text><text x="405" y="115">Validate</text><text x="575" y="60">Answer</text><text x="575" y="180">Escalate</text></g></svg></section><section><h2>4. State and trace</h2><pre id="out" aria-live="polite"></pre></section><script>const docs=[{id:'P01',text:'leave requests require manager approval'},{id:'P02',text:'expenses require receipts'}];document.getElementById('run').onclick=()=>{let q=document.getElementById('q').value.toLowerCase(),terms=new Set(q.match(/\w+/g)||[]),rank=docs.map(d=>({...d,score:d.text.split(' ').filter(w=>terms.has(w)&&w!=='require').length})).sort((a,b)=>b.score-a.score),ok=rank[0].score>rank[1].score&&rank[0].score>0,trace=['start','retrieve','validate',ok?'answer':'escalate'];for(let id of ['start','retrieve','validate','answer','escalate'])document.getElementById(id).classList.toggle('active',trace.includes(id));document.getElementById('out').textContent=JSON.stringify({query:q,evidence:ok?rank[0]:null,trace,decision:ok?'Return evidence':'Human review'},null,2)};</script>
