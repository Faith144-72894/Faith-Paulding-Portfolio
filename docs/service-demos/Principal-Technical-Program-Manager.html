<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Dependency scheduling</title><style>body{font:16px system-ui;background:#eef2f7;color:#17334f;max-width:900px;margin:30px auto;padding:20px}section{background:white;padding:20px;border-radius:12px;margin:15px 0}label{display:block;margin-top:12px}textarea{width:100%;box-sizing:border-box;padding:8px;font:inherit}button{padding:12px;background:#17334f;color:white;border:0;margin-top:15px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><a href="../service-index.html">All service demos</a><h1>Dependency scheduling</h1><p>Local Python service • synthetic data only • successful runs stored in SQLite</p><section><form id="form"><label for="f0">Tasks JSON</label><textarea required id="f0">{"A":{"days":3,"deps":[]},"B":{"days":5,"deps":["A"]}}</textarea><button>Run analysis</button></form></section><section><h2>Service result</h2><pre id="out" aria-live="polite"></pre></section><script>const keys=["tasks"],sample=[{"A":{"days":3,"deps":[]},"B":{"days":5,"deps":["A"]}}];document.getElementById('form').onsubmit=async e=>{e.preventDefault();let out=document.getElementById('out');try{let payload=Object.fromEntries(keys.map((k,i)=>{let v=document.getElementById('f'+i).value;return [k,typeof sample[i]==='string'?v:JSON.parse(v)]}));let res=await fetch('/api/Principal-Technical-Program-Manager',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let data=await res.json();out.textContent=JSON.stringify(data,null,2)}catch(e){out.textContent='Run python service.py locally. '+e.message}};</script></html>
