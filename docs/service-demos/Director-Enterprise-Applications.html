<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Application integration</title><link rel="stylesheet" href="../dashboard.css"><body><header><a href="../service-index.html">Portfolio /</a><h1>Application integration</h1><p>Independent local prototype · Synthetic data</p></header><main><section class="flow"><span>Intake</span><b>→</b><span>Validation</span><b>→</b><span>Approval</span></section><section class="workspace"><form id="form"><h2>Scenario configuration</h2><label for="f0">id</label><textarea id="f0" required>REQ-01</textarea><label for="f1">amount</label><textarea id="f1" required>15000</textarea><button>Run analysis</button><p id="error" role="alert"></p></form><section><h2>Decision scorecard</h2><div id="cards" class="cards" aria-live="polite"></div><h2>Analysis visualization</h2><div id="chart"></div><details><summary>Raw service response</summary><pre id="raw"></pre></details></section></section></main><script>const keys=["id","amount"],strings=["id"],metrics=["status"];const el=id=>document.getElementById(id);function node(tag,text){let n=document.createElement(tag);n.textContent=text;return n}el('form').onsubmit=async e=>{e.preventDefault();el('error').textContent='';el('cards').replaceChildren();el('chart').replaceChildren();try{let payload=Object.fromEntries(keys.map((k,i)=>[k,strings.includes(k)?el('f'+i).value:JSON.parse(el('f'+i).value)]));let res=await fetch('/api/Director-Enterprise-Applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let body=await res.json();el('raw').textContent=JSON.stringify(body,null,2);if(!res.ok)throw Error(body.error);let r=body.result;for(let [k,v] of Object.entries(r)){let a=node('article','');a.append(node('small',k.replaceAll('_',' ')),node('strong',typeof v==='object'?JSON.stringify(v):String(v)));el('cards').append(a)}let data=metrics.map(k=>[k,r[k]]).filter(([k,v])=>typeof v==='number'&&Number.isFinite(v));let max=Math.max(1,...data.map(x=>Math.abs(x[1])));for(let [k,v] of data){let row=node('div','');row.append(node('label',k+' · '+v.toFixed(2)));let bar=node('div','');bar.className='bar';bar.style.width=(Math.abs(v)/max*100)+'%';if(v<0)bar.classList.add('negative');row.append(bar);el('chart').append(row)}if(!data.length)el('chart').append(node('p','Decision shown in scorecard; no numeric series.'))}catch(e){el('error').textContent=e.message}};</script></body></html>
