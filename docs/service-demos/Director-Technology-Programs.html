<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Portfolio performance</title><link rel="stylesheet" href="../dashboard.css"><body><header><a href="../service-index.html">Portfolio /</a><h1>Portfolio performance</h1><p>Independent local prototype · Synthetic data</p></header><main><section class="flow"><span>Baseline</span><b>→</b><span>Performance</span><b>→</b><span>Forecast</span></section><section class="workspace"><form id="form"><h2>Scenario configuration</h2><label for="f0">ev</label><textarea id="f0" required>80000</textarea><label for="f1">pv</label><textarea id="f1" required>100000</textarea><label for="f2">ac</label><textarea id="f2" required>90000</textarea><label for="f3">bac</label><textarea id="f3" required>200000</textarea><button>Run analysis</button><p id="error" role="alert"></p></form><section><h2>Decision scorecard</h2><div id="cards" class="cards" aria-live="polite"></div><h2>Analysis visualization</h2><div id="chart"></div><details><summary>Raw service response</summary><pre id="raw"></pre></details></section></section></main><script>const keys=["ev","pv","ac","bac"],strings=[],metrics=["cpi","spi","eac"];const el=id=>document.getElementById(id);function node(tag,text){let n=document.createElement(tag);n.textContent=text;return n}el('form').onsubmit=async e=>{e.preventDefault();el('error').textContent='';el('cards').replaceChildren();el('chart').replaceChildren();try{let payload=Object.fromEntries(keys.map((k,i)=>[k,strings.includes(k)?el('f'+i).value:JSON.parse(el('f'+i).value)]));let res=await fetch('/api/Director-Technology-Programs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let body=await res.json();el('raw').textContent=JSON.stringify(body,null,2);if(!res.ok)throw Error(body.error);let r=body.result;for(let [k,v] of Object.entries(r)){let a=node('article','');a.append(node('small',k.replaceAll('_',' ')),node('strong',typeof v==='object'?JSON.stringify(v):String(v)));el('cards').append(a)}let data=metrics.map(k=>[k,r[k]]).filter(([k,v])=>typeof v==='number'&&Number.isFinite(v));for(let [k,v] of data){let row=node('div','');row.append(node('label',k+' · '+v.toFixed(2)));let scale=k==='eac'?Math.max(1,Math.abs(v),Number(payload.bac)||0):Math.max(1,Math.abs(v));let bar=node('div','');bar.className='bar';bar.style.width=(Math.abs(v)/scale*100)+'%';if(v<0)bar.classList.add('negative');row.append(node('small',(k==='eac'?'Currency scale: ':'Index scale: ')+scale.toLocaleString()),bar);el('chart').append(row)}if(!data.length)el('chart').append(node('p','Decision shown in scorecard; no numeric series.'))}catch(e){el('error').textContent=e.message}};</script></body></html>
