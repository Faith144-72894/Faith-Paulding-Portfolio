<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Investment planning</title><style>body{font:16px system-ui;background:#eef2f7;color:#17334f;max-width:900px;margin:30px auto;padding:20px}section{background:white;padding:20px;border-radius:12px;margin:15px 0}label{display:block;margin-top:12px}textarea{width:100%;box-sizing:border-box;padding:8px;font:inherit}button{padding:12px;background:#17334f;color:white;border:0;margin-top:15px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><a href="../service-index.html">All service demos</a><h1>Investment planning</h1><p>Local Python service • synthetic data only • successful runs stored in SQLite</p><section><form id="form"><label for="f0">Hours</label><textarea required id="f0">2000</textarea><label for="f1">Rate</label><textarea required id="f1">60</textarea><label for="f2">Adoption fraction</label><textarea required id="f2">0.8</textarea><label for="f3">Cost</label><textarea required id="f3">40000</textarea><button>Run analysis</button></form></section><section><h2>Service result</h2><pre id="out" aria-live="polite"></pre></section><script>const keys=["hours","rate","adoption","cost"],sample=[2000,60,0.8,40000];document.getElementById('form').onsubmit=async e=>{e.preventDefault();let out=document.getElementById('out');try{let payload=Object.fromEntries(keys.map((k,i)=>{let v=document.getElementById('f'+i).value;return [k,typeof sample[i]==='string'?v:JSON.parse(v)]}));let res=await fetch('/api/Director-AI-Digital-Transformation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let data=await res.json();out.textContent=JSON.stringify(data,null,2)}catch(e){out.textContent='Run python service.py locally. '+e.message}};</script></html>
