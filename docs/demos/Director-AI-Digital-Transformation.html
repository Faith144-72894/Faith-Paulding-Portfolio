<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AI Investment Planner</title><style>body{margin:0;background:#eef2f7;color:#152b42;font:16px system-ui}header{background:#17334f;color:white;padding:24px}main{max-width:1000px;margin:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}section{background:white;border-radius:12px;padding:22px}label{display:block;margin:14px 0 5px}input,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #aab8c8;border-radius:5px;font:inherit}button{background:#185c9d;color:white;border:0;padding:12px 20px;margin-top:18px;border-radius:5px;cursor:pointer}article{padding:14px 0;border-bottom:1px solid #dbe2ea;overflow-wrap:anywhere}strong{display:block;font-size:20px}small{display:block}#error{color:#a32636}</style><header><small>Independent functional prototype • synthetic data</small><h1>AI Investment Planner</h1><p>Benefits realization</p></header><main><section><h2>1. Configure scenario</h2><form id="form"><label for="f0">Annual hours saved</label><input required type="number" step="any" id="f0" value="2000"><label for="f1">Hourly value</label><input required type="number" step="any" id="f1" value="60"><label for="f2">Adoption fraction</label><input required type="number" step="any" id="f2" value="0.8"><label for="f3">Annual cost</label><input required type="number" step="any" id="f3" value="40000"><button>2. Run analysis</button></form><p id="error" role="alert"></p></section><section><h2>3. Review decision</h2><div id="results" aria-live="polite"></div><p>Local browser logic only. No vendor connection, authentication or production deployment.</p></section></main><script>const defaults=[2000,60,0.8,40000];function evaluate(v){let [h,r,a,c]=v;if(h<0||r<0||a<0||a>1||c<=0)throw Error('Invalid assumptions');return {'Annual benefit':h*r*a,'Net benefit':h*r*a-c,'ROI %':100*(h*r*a-c)/c,'ROI at 25% adoption':100*(h*r*.25-c)/c,'ROI at 75% adoption':100*(h*r*.75-c)/c}}const form=document.getElementById('form');function run(e){if(e)e.preventDefault();const out=document.getElementById('results'),err=document.getElementById('error');out.replaceChildren();err.textContent='';try{let v=defaults.map((d,i)=>{let s=document.getElementById('f'+i).value;if(!s.trim())throw Error('All fields required');if(typeof d==='number'){let n=Number(s);if(!Number.isFinite(n))throw Error('Finite number required');return n}return s});let r=evaluate(v);for(let [k,val] of Object.entries(r)){let a=document.createElement('article'),b=document.createElement('strong');a.textContent=k;b.textContent=typeof val==='number'?Number(val.toFixed(4)).toLocaleString():String(val);a.append(b);out.append(a)}}catch(e){err.textContent=e.message}}form.addEventListener('submit',run);run();</script></html>
