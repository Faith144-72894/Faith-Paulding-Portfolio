<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Knowledge Retrieval Workbench</title><style>body{margin:0;background:#eef2f7;color:#152b42;font:16px system-ui}header{background:#17334f;color:white;padding:24px}main{max-width:1000px;margin:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}section{background:white;border-radius:12px;padding:22px}label{display:block;margin:14px 0 5px}input,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #aab8c8;border-radius:5px;font:inherit}button{background:#185c9d;color:white;border:0;padding:12px 20px;margin-top:18px;border-radius:5px;cursor:pointer}article{padding:14px 0;border-bottom:1px solid #dbe2ea;overflow-wrap:anywhere}strong{display:block;font-size:20px}small{display:block}#error{color:#a32636}</style><header><small>Independent functional prototype • synthetic data</small><h1>Knowledge Retrieval Workbench</h1><p>Lexical retrieval, not an LLM</p></header><main><section><h2>1. Configure scenario</h2><form id="form"><label for="f0">Search query</label><textarea required id="f0" rows="2">leave approval</textarea><button>2. Run analysis</button></form><p id="error" role="alert"></p></section><section><h2>3. Review decision</h2><div id="results" aria-live="polite"></div><p>Local browser logic only. No vendor connection, authentication or production deployment.</p></section></main><script>const defaults=["leave approval"];function evaluate(v){let q=v[0].toLowerCase().match(/\w+/g)||[];let docs=[['P01','leave requests require manager approval'],['P02','expenses require receipts'],['P03','restricted records require security authorization']];let ranked=docs.map(([id,d])=>({id,d,s:[...new Set(q)].filter(w=>d.split(' ').includes(w)&&w!=='require').length})).sort((a,b)=>b.s-a.s);return ranked[0].s&&ranked[0].s>ranked[1].s?{'Source':ranked[0].id,'Retrieved evidence':ranked[0].d,'Matched terms':ranked[0].s}:{'Decision':'Human escalation','Reason':'No unique evidence match'}}const form=document.getElementById('form');function run(e){if(e)e.preventDefault();const out=document.getElementById('results'),err=document.getElementById('error');out.replaceChildren();err.textContent='';try{let v=defaults.map((d,i)=>{let s=document.getElementById('f'+i).value;if(!s.trim())throw Error('All fields required');if(typeof d==='number'){let n=Number(s);if(!Number.isFinite(n))throw Error('Finite number required');return n}return s});let r=evaluate(v);for(let [k,val] of Object.entries(r)){let a=document.createElement('article'),b=document.createElement('strong');a.textContent=k;b.textContent=typeof val==='number'?Number(val.toFixed(4)).toLocaleString():String(val);a.append(b);out.append(a)}}catch(e){err.textContent=e.message}}form.addEventListener('submit',run);run();</script></html>
