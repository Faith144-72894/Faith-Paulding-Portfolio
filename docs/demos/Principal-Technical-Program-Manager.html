<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Dependency Planning Studio</title><style>body{margin:0;background:#eef2f7;color:#152b42;font:16px system-ui}header{background:#17334f;color:white;padding:24px}main{max-width:1000px;margin:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}section{background:white;border-radius:12px;padding:22px}label{display:block;margin:14px 0 5px}input,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #aab8c8;border-radius:5px;font:inherit}button{background:#185c9d;color:white;border:0;padding:12px 20px;margin-top:18px;border-radius:5px;cursor:pointer}article{padding:14px 0;border-bottom:1px solid #dbe2ea;overflow-wrap:anywhere}strong{display:block;font-size:20px}small{display:block}#error{color:#a32636}</style><header><small>Independent functional prototype • synthetic data</small><h1>Dependency Planning Studio</h1><p>Critical path planning</p></header><main><section><h2>1. Configure scenario</h2><form id="form"><label for="f0">Tasks JSON</label><textarea required id="f0" rows="5">{&quot;Design&quot;:{&quot;days&quot;:3,&quot;deps&quot;:[]},&quot;Build&quot;:{&quot;days&quot;:5,&quot;deps&quot;:[&quot;Design&quot;]},&quot;Test&quot;:{&quot;days&quot;:2,&quot;deps&quot;:[&quot;Build&quot;]}}</textarea><button>2. Run analysis</button></form><p id="error" role="alert"></p></section><section><h2>3. Review decision</h2><div id="results" aria-live="polite"></div><p>Local browser logic only. No vendor connection, authentication or production deployment.</p></section></main><script>const defaults=["{\"Design\":{\"days\":3,\"deps\":[]},\"Build\":{\"days\":5,\"deps\":[\"Design\"]},\"Test\":{\"days\":2,\"deps\":[\"Build\"]}}"];function evaluate(v){let tasks=JSON.parse(v[0]),f={},paths={},active=new Set();function visit(k){if(!Object.hasOwn(tasks,k)||active.has(k))throw Error('Missing dependency or cycle');if(Object.hasOwn(f,k))return f[k];let t=tasks[k];if(typeof t.days!=='number'||!Number.isFinite(t.days)||t.days<0||!Array.isArray(t.deps))throw Error('Invalid task');active.add(k);let prior=null;for(let d of t.deps){visit(d);if(prior===null||f[d]>f[prior])prior=d}f[k]=t.days+(prior===null?0:f[prior]);paths[k]=[...(prior===null?[]:paths[prior]),k];active.delete(k);return f[k]}let keys=Object.keys(tasks);if(!keys.length)throw Error('Tasks required');keys.forEach(visit);let end=keys.sort((a,b)=>f[b]-f[a])[0];return {'Duration days':f[end],'Critical path':paths[end].join(' → '),'Finish days':JSON.stringify(f)}}const form=document.getElementById('form');function run(e){if(e)e.preventDefault();const out=document.getElementById('results'),err=document.getElementById('error');out.replaceChildren();err.textContent='';try{let v=defaults.map((d,i)=>{let s=document.getElementById('f'+i).value;if(!s.trim())throw Error('All fields required');if(typeof d==='number'){let n=Number(s);if(!Number.isFinite(n))throw Error('Finite number required');return n}return s});let r=evaluate(v);for(let [k,val] of Object.entries(r)){let a=document.createElement('article'),b=document.createElement('strong');a.textContent=k;b.textContent=typeof val==='number'?Number(val.toFixed(4)).toLocaleString():String(val);a.append(b);out.append(a)}}catch(e){err.textContent=e.message}}form.addEventListener('submit',run);run();</script></html>
