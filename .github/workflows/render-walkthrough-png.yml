name: Render walkthrough PNGs
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render-walkthrough-png.yml'
      - 'Role_Specific_Portfolio/**/walkthrough/*.svg'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Render and link PNG previews
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          root = Path('Role_Specific_Portfolio')
          for source in root.glob('*/simulations/*/walkthrough/step-*.svg'):
              cairosvg.svg2png(url=str(source), write_to=str(source.with_suffix('.png')), output_width=1600)
          for doc in [root/'CLICK-BY-CLICK.md', *root.glob('*/simulations/*/walkthrough/README.md')]:
              import re
              original = doc.read_text()
              updated = re.sub(r'(step-\d+)\.svg', r'\1.png', original)
              if updated != original:
                  doc.write_text(updated)
          PY
      - name: Commit rendered PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Role_Specific_Portfolio
          if ! git diff --cached --quiet; then
            git commit -m "Publish PNG walkthrough previews from existing reconstructions"
            git push
          fi
