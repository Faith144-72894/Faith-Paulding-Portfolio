name: Flagship reference tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5
      - run: |
          for folder in Role_Specific_Portfolio/*/flagship; do
            (cd "$folder" && python -m pytest -q) || exit 1
          done
