name: Browser smoke tests
on: [push, pull_request]
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.51.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save @playwright/test@1.51.1
      - run: python3 --version
      - run: npx playwright test tests/browser.spec.js --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
