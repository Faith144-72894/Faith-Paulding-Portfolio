name: Browser smoke tests
on: [push, pull_request]
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: python service.py &
      - run: for i in {1..20}; do curl -fsS http://127.0.0.1:8765/service-index.html && exit 0; sleep 1; done; exit 1
      - run: npx playwright test tests/browser.spec.js --workers=1
